---
name: Build and release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after all builds pass
        type: boolean
        default: false
      release_tag:
        description: Optional version tag (for example, v2); leave empty to advance highest numeric tag
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.publish_release && 'release' || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release options
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: version
        if: inputs.publish_release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python topbar_runner/release_version.py
      - name: Check release tag
        if: inputs.publish_release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG points to $tag_commit, not build commit $GITHUB_SHA." >&2
              exit 1
            fi
          fi

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15-intel
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Ruff
        run: poetry run ruff check .
      - name: Tests
        run: poetry run pytest

  build:
    name: Build / ${{ matrix.platform }}
    needs: [validate, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: apple-silicon
          - os: macos-15-intel
            platform: intel
          - os: ubuntu-latest
            platform: ubuntu
          - os: windows-latest
            platform: windows
    env:
      QT_QPA_PLATFORM: offscreen
      ARCHIVE_LABEL: ${{ inputs.publish_release && needs.validate.outputs.release_tag || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install --with build
      - name: Build app
        run: poetry run pyinstaller --noconfirm packaging/pyinstaller/topbar-runner.spec
      - name: Smoke test packaged app
        if: runner.os == 'Linux'
        run: dist/topbar-runner/topbar-runner --console --plugin-dir examples/plugins
      - name: Smoke test packaged app
        if: runner.os == 'macOS'
        run: dist/topbar-runner.app/Contents/MacOS/topbar-runner --console --plugin-dir examples/plugins
      - name: Smoke test macOS GUI startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd /
          "$GITHUB_WORKSPACE/dist/topbar-runner.app/Contents/MacOS/topbar-runner" \
            --config-path "$RUNNER_TEMP/topbar-runner-smoke.toml" \
            --plugin-dir "$GITHUB_WORKSPACE/examples/plugins" &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/topbar-runner-smoke.log"
            exit 1
          fi
      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict dist/topbar-runner.app
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: tar -C dist -czf "topbar-runner-${ARCHIVE_LABEL}-${{ matrix.platform }}.tar.gz" topbar-runner.app
      - name: Archive Linux app
        if: runner.os == 'Linux'
        run: tar -C dist -czf "topbar-runner-${ARCHIVE_LABEL}-ubuntu.tar.gz" topbar-runner
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/topbar-runner -DestinationPath "topbar-runner-$($env:ARCHIVE_LABEL)-windows.zip"
      - name: Smoke test Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "topbar-runner-$($env:ARCHIVE_LABEL)-windows.zip"
          $unpacked = Join-Path $env:RUNNER_TEMP 'topbar-runner-archive'
          Expand-Archive -Path $archive -DestinationPath $unpacked
          $bundle = Join-Path $unpacked 'topbar-runner'
          if (!(Test-Path (Join-Path $bundle '_internal/python313.dll'))) {
            throw 'Packaged Python DLL missing from Windows archive.'
          }
          & (Join-Path $bundle 'topbar-runner.exe') --console --plugin-dir examples/plugins
      - uses: actions/upload-artifact@v4
        with:
          name: topbar-runner-${{ matrix.platform }}
          path: topbar-runner-${{ env.ARCHIVE_LABEL }}-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [validate, build]
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: topbar-runner-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --generate-notes
